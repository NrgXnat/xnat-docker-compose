# Settings shared by the XNAT web nodes. They run the published XNAT image, with XNAT's
# home at the image's /data/xnat/home. xnat-start.sh writes XNAT's configuration from
# these variables on every start, then runs the image's own entrypoint.
x-xnat-web: &xnat-web
  image: ${XNAT_IMAGE}:${XNAT_VERSION}
  entrypoint: ["/bin/sh", "/usr/local/bin/xnat-start.sh"]
  # Runs as XNAT_UID in the image's group (1000), which can write the image's paths.
  # On Linux, XNAT_UID is your own uid, so XNAT can write the directories mounted here.
  user: "${XNAT_UID:-1000}:1000"
  # Lets XNAT use the Docker socket for the container service. The socket's group
  # is 0 on Docker Desktop; on Linux, set DOCKER_GID to `stat -c %g /var/run/docker.sock`.
  group_add:
    - "${DOCKER_GID:-0}"
  networks:
    - xnat-network
  environment:
    CATALINA_OPTS: -Xms${XNAT_MIN_HEAP} -Xmx${XNAT_MAX_HEAP} -Dxnat.home=/data/xnat/home
    # Time zone for XNAT's clock and the times it shows.
    TZ: ${XNAT_TZ:-Etc/UTC}
    # Send XNAT's logs to the container's stdout (docker compose logs).
    XNAT_LOG_CONSOLE: plain
    XNAT_DATASOURCE_DRIVER: ${XNAT_DATASOURCE_DRIVER}
    XNAT_DATASOURCE_URL: ${XNAT_DATASOURCE_URL}
    XNAT_DATASOURCE_USERNAME: ${XNAT_DATASOURCE_USERNAME}
    XNAT_DATASOURCE_PASSWORD: ${XNAT_DATASOURCE_PASSWORD}
    XNAT_ACTIVEMQ_URL: ${XNAT_ACTIVEMQ_URL}
    XNAT_ACTIVEMQ_USERNAME: ${XNAT_ACTIVEMQ_USERNAME}
    XNAT_ACTIVEMQ_PASSWORD: ${XNAT_ACTIVEMQ_PASSWORD}
    XNAT_EMAIL: ${XNAT_EMAIL}
    XNAT_SMTP_ENABLED: ${XNAT_SMTP_ENABLED}
    XNAT_SMTP_HOSTNAME: ${XNAT_SMTP_HOSTNAME}
    XNAT_SMTP_PORT: ${XNAT_SMTP_PORT}
    XNAT_SMTP_AUTH: ${XNAT_SMTP_AUTH}
    XNAT_SMTP_USERNAME: ${XNAT_SMTP_USERNAME}
    XNAT_SMTP_PASSWORD: ${XNAT_SMTP_PASSWORD}
    XNAT_SMTP_START_TLS: ${XNAT_SMTP_START_TLS}

services:

  xnat-web:
    <<: *xnat-web
    container_name: xnat-web
    hostname: xnat-web-1
    ports:
      - 8104:8104
    volumes:
      - ./xnat/xnat-start.sh:/usr/local/bin/xnat-start.sh:ro
      - ./xnat/plugins:/data/xnat/home/plugins
      - ./xnat/node-conf/node1.properties:/data/xnat/home/config/node-conf.properties
      - ./xnat-data/home/logs:/data/xnat/home/logs
      - ./xnat-data/archive:${XNAT_ROOT}/archive
      - ./xnat-data/build:${XNAT_ROOT}/build
      - ./xnat-data/cache:${XNAT_ROOT}/cache
      - ./xnat-data/prearchive:${XNAT_ROOT}/prearchive
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      xnat-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Second XNAT web node — enabled only with the "multinode" profile
  # (COMPOSE_PROFILES=multinode). Runs the same image as xnat-web.
  xnat-web-2:
    <<: *xnat-web
    container_name: xnat-web-2
    hostname: xnat-web-2
    profiles: ["multinode"]
    volumes:
      - ./xnat/xnat-start.sh:/usr/local/bin/xnat-start.sh:ro
      - ./xnat/plugins:/data/xnat/home/plugins
      - ./xnat/node-conf/node2.properties:/data/xnat/home/config/node-conf.properties
      - ./xnat-data/home2/logs:/data/xnat/home/logs
      - ./xnat-data/archive:${XNAT_ROOT}/archive
      - ./xnat-data/build:${XNAT_ROOT}/build
      - ./xnat-data/cache:${XNAT_ROOT}/cache
      - ./xnat-data/prearchive:${XNAT_ROOT}/prearchive
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      xnat-db:
        condition: service_healthy
      xnat-activemq:
        condition: service_started
      xnat-web:
        condition: service_healthy

  # External ActiveMQ broker — enabled only with the "multinode" profile.
  xnat-activemq:
    container_name: xnat-activemq
    image: apache/activemq-classic:${ACTIVEMQ_VERSION}
    profiles: ["multinode"]
    expose:
      - 61616
    ports:
      - 8161:8161
    networks:
      - xnat-network

  xnat-db:
    container_name: xnat-db
    image: postgres:${PG_VERSION}
    expose:
      - 5432
    networks:
      - xnat-network
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=${XNAT_DATASOURCE_ADMIN_PASSWORD}
      - POSTGRES_DB=${XNAT_DATASOURCE_NAME}
      # variables for the sql script
      - XNAT_DATASOURCE_USERNAME=${XNAT_DATASOURCE_USERNAME}
      - XNAT_DATASOURCE_PASSWORD=${XNAT_DATASOURCE_PASSWORD}
    # Checks over TCP, so it passes only after the init scripts in ./postgres have run:
    # the image's temporary server during initialization doesn't listen on TCP.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${XNAT_DATASOURCE_USERNAME} -d ${XNAT_DATASOURCE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30

  xnat-nginx:
    container_name: xnat-nginx
    image: nginx:${NGINX_VERSION}
    # NGINX_CONF selects the routing config: nginx.conf (single node, default) or
    # nginx-multinode.conf (load-balances xnat-web + xnat-web-2).
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf
    ports:
      - 80:80
    networks:
      - xnat-network
    # restart handles the multi-node startup race: the upstream resolves xnat-web-2
    # at config load, so nginx may exit if it boots first; the restart recovers once
    # the second node exists. (A non-profiled service can't cleanly depend on a
    # profile-gated one, so we don't add xnat-web-2 to depends_on.)
    restart: unless-stopped
    depends_on:
      - xnat-web
    links:
      - xnat-web

networks:
  xnat-network:
    name: xnat-network
